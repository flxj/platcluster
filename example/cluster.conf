service{
    name = "service1"
    host = "0.0.0.0"
    port = 8080
    logLevel = "info"
}

storage {
    logDriver = "platdb:/var/lib/platcluster/log.db"
    dataDriver = "platdb:/var/lib/platcluster/data.db"
}

raft {
    id = "1"
    transport = "http" 
    maxLogEntriesPerRequest = 1000
    heartbeatInterval = 1000
    electionTimeout = 15000
    confDir = "/etc/platcluster"
    snapshotDir = "/var/lib/platcluster"
    servers = [
        {
            id = "1"
            ip = "localhost"
            port = 3887
        },
        {
            id = "2"
            ip = "localhost"
            port = 3888
        },
        {
            id = "3"
            ip = "localhost"
            port = 3889
        }
    ]
}